[project]
name = "shiguang-plugin"
version = "1.0.1"
description = "拾光集 — Qingci-Bot 安全插画发图 + 签到插件（由画境拾珍移植）"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "qingci-plugin-sdk",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__", ".git", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "dist", "build", "tests", "data"]

# 业务层由 astrbot 插件原样移植，存在历史宽松类型写法；
# 入口（__init__.py / _event.py）保持严格检查，业务层逐项收敛。
[[tool.mypy.overrides]]
module = ["checkin.*", "pixiv.*", "shiguang.checkin.*", "shiguang.pixiv.*"]
disable_error_code = [
    "arg-type",
    "call-overload",
    "assignment",
    "attr-defined",
    "union-attr",
    "no-any-return",
    "return-value",
]
